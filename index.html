<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>BH Football Manager Lite</title>
<style>
:root{--bg:#0d1117;--card:#151b23;--card2:#1b2430;--text:#f3f6f9;--muted:#9aa6b2;--accent:#4ade80;--danger:#fb7185;--line:#273241}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:80px}.top{position:sticky;top:0;background:rgba(13,17,23,.96);backdrop-filter:blur(10px);z-index:5;padding:14px 16px;border-bottom:1px solid var(--line)}
h1,h2,h3{margin:0 0 8px}.sub{color:var(--muted);font-size:12px}.screen{padding:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.stat{font-size:20px;font-weight:700}.label{font-size:11px;color:var(--muted);text-transform:uppercase}
button,select{min-height:44px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:10px 12px;font-weight:600}
button{cursor:pointer}button.primary{background:#166534;border-color:#15803d}button.danger{background:#4c1720;border-color:#7f1d1d}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.tabs{display:flex;gap:6px;overflow:auto;padding:10px 16px;border-bottom:1px solid var(--line)}
.tabs button{white-space:nowrap;min-height:42px}.tabs .on{border-color:var(--accent);color:var(--accent)}
.club{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:10px;margin:7px 0}
.badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#263244;font-weight:800}
.list{max-height:360px;overflow:auto}.player{display:grid;grid-template-columns:1fr 48px 48px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.pitch{height:430px;border-radius:14px;border:2px solid #d9f99d;background:linear-gradient(#3f7d3a,#346d31);position:relative;overflow:hidden}
.pitch:before{content:"";position:absolute;left:8%;right:8%;top:7%;bottom:7%;border:2px solid rgba(255,255,255,.7);border-radius:3px}
.pitch:after{content:"";position:absolute;left:20%;right:20%;top:50%;border-top:2px solid rgba(255,255,255,.7)}
.mark{position:absolute;transform:translate(-50%,-50%);text-align:center}.shirt{width:34px;height:34px;border-radius:50%;background:#f8fafc;color:#111827;display:grid;place-items:center;font-size:11px;font-weight:800;border:2px solid #111827}
.small{font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:2px 5px;border-radius:5px;margin-top:2px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notice{padding:10px;border-radius:10px;background:#111827;color:#cbd5e1;font-size:12px}.green{color:var(--accent)}.red{color:var(--danger)}
.live-feed{max-height:340px;overflow:auto;scroll-behavior:smooth}.live-event{display:grid;grid-template-columns:48px 28px 1fr;gap:8px;align-items:start;padding:10px 2px;border-bottom:1px solid var(--line);animation:event-in .28s ease-out}.live-event:last-child{border-bottom:0}.live-minute{color:var(--accent);font-weight:800}.live-icon{font-size:18px;text-align:center}.live-score{font-size:30px;font-weight:800;text-align:center;margin:10px 0}.live-controls{display:flex;gap:8px}.live-controls button{flex:1}@keyframes event-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.footer{position:fixed;bottom:0;left:0;right:0;background:#11161d;border-top:1px solid var(--line);padding:9px;text-align:center;color:var(--muted);font-size:11px}
@media(min-width:700px){.footer{left:50%;right:auto;width:760px;transform:translateX(-50%)}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="row"><div><h1>BH Football Manager Lite</h1><div class="sub">2026/27 • Local Career • v0.24 History & Trophy Celebrations</div></div><button onclick="resetGame()">Reset</button></div></div>
<div id="tabs" class="tabs"></div><main id="app" class="screen"></main>
<div class="footer">Local save • No account • No server required</div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body></html>
