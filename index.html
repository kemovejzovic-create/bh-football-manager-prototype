<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>BH Football Manager Lite</title>
<style>
:root{--bg:#0d1117;--card:#151b23;--card2:#1b2430;--text:#f3f6f9;--muted:#9aa6b2;--accent:#4ade80;--danger:#fb7185;--line:#273241}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:80px}.top{position:sticky;top:0;background:rgba(13,17,23,.96);backdrop-filter:blur(10px);z-index:5;padding:14px 16px;border-bottom:1px solid var(--line)}
h1,h2,h3{margin:0 0 8px}.sub{color:var(--muted);font-size:12px}.screen{padding:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.stat{font-size:20px;font-weight:700}.label{font-size:11px;color:var(--muted);text-transform:uppercase}
button,select{min-height:44px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:10px 12px;font-weight:600}
button{cursor:pointer}button.primary{background:#166534;border-color:#15803d}button.danger{background:#4c1720;border-color:#7f1d1d}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.tabs{display:flex;gap:6px;overflow:auto;padding:10px 16px;border-bottom:1px solid var(--line)}
.tabs button{white-space:nowrap;min-height:42px}.tabs .on{border-color:var(--accent);color:var(--accent)}
.club{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:10px;margin:7px 0}
.badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#263244;font-weight:800}
.list{max-height:360px;overflow:auto}.player{display:grid;grid-template-columns:1fr 48px 48px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.pitch{height:430px;border-radius:14px;border:2px solid #d9f99d;background:linear-gradient(#3f7d3a,#346d31);position:relative;overflow:hidden}
.pitch:before{content:"";position:absolute;left:8%;right:8%;top:7%;bottom:7%;border:2px solid rgba(255,255,255,.7);border-radius:3px}
.pitch:after{content:"";position:absolute;left:20%;right:20%;top:50%;border-top:2px solid rgba(255,255,255,.7)}
.mark{position:absolute;transform:translate(-50%,-50%);text-align:center}.shirt{width:34px;height:34px;border-radius:50%;background:#f8fafc;color:#111827;display:grid;place-items:center;font-size:11px;font-weight:800;border:2px solid #111827}
.small{font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:2px 5px;border-radius:5px;margin-top:2px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notice{padding:10px;border-radius:10px;background:#111827;color:#cbd5e1;font-size:12px}.green{color:var(--accent)}.red{color:var(--danger)}
.footer{position:fixed;bottom:0;left:0;right:0;background:#11161d;border-top:1px solid var(--line);padding:9px;text-align:center;color:var(--muted);font-size:11px}
@media(min-width:700px){.footer{left:50%;right:auto;width:760px;transform:translateX(-50%)}}
</style>
</head>

function playersFor(club){
 if(seedPlayers[club]) return seedPlayers[club].map((x,i)=>({id:i,pos:x[0],name:x[1],age:x[2],ovr:x[3]}));
 const names=fbihXI[club]||[];
 const pos=['GK','DEF','DEF','DEF','DEF','MID','MID','MID','MID','ATT','ATT'];
 return names.map((n,i)=>({id:i,pos:pos[i],name:n,age:18+(i%13),ovr:52+(i%9)}));
}

"4-3-3":[["GK",50,88],["LB",20,72],["CB",40,78],["CB",60,78],["RB",80,72],["CM",32,52],["CM",50,47],["CM",68,52],["LW",20,27],["ST",50,18],["RW",80,27]],

};
const TEAM_RATING={"FK Sarajevo":72,"FK Željezničar":71,"FK Borac Banja Luka":74,"HŠK Zrinjski Mostar":75,"FK Velež Mostar":68,"NK Široki Brijeg":67,"FK Sloga Meridian":62,"FK Radnik Bijeljina":59,"NK Čelik Zenica":58,"BSK Banja Luka":56};
const DEFAULT_RATING=56;
let state=JSON.parse(localStorage.getItem("bhfm")||"null")||{club:"FK Sarajevo",league:"Premijer Liga BiH",rep:50,balance:500000,points:0,played:0,wins:0,draws:0,losses:0,formation:"4-3-3",mentality:"Balanced",players:[],xi:[],tab:"Home",season:2026,matchday:0,fixtures:[],table:{},results:[]};

function teamRating(club){if(TEAM_RATING[club])return TEAM_RATING[club];const ps=playersFor(club);return Math.round(ps.reduce((a,p)=>a+p.ovr,0)/ps.length)||DEFAULT_RATING}
function leagueClubs(){return leagues[state.league].filter(c=>!c.startsWith("TBD")&&!c.includes("regional"))}
function makeTable(){const t={};leagueClubs().forEach(c=>t[c]={club:c,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});return t}
function generateFixtures(clubs){
 let arr=[...clubs],n=arr.length,rounds=[];
 for(let r=0;r<n-1;r++){let games=[];for(let i=0;i<n/2;i++){let a=arr[i],b=arr[n-1-i];games.push(r%2===0?{home:a,away:b}:{home:b,away:a})}rounds.push(games);arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]}
 return [...rounds,...rounds.map(g=>g.map(x=>({home:x.away,away:x.home})))].flat()
}
function initSeason(force=false){
 const clubs=leagueClubs(),needed=clubs.length*(clubs.length-1);
 if(force||!Array.isArray(state.fixtures)||state.fixtures.length!==needed||!state.table||Object.keys(state.table).length!==clubs.length){
  state.matchday=0;state.fixtures=generateFixtures(clubs);state.table=makeTable();state.results=[];state.points=0;state.played=0;state.wins=0;state.draws=0;state.losses=0;
 }
}
function save(){localStorage.setItem("bhfm",JSON.stringify(state))}
function normalizeXI(){
 const valid=state.players.map(p=>p.id), seen=new Set(), out=[];
 (Array.isArray(state.xi)?state.xi:[]).forEach(id=>{id=+id;if(valid.includes(id)&&!seen.has(id)){seen.add(id);out.push(id)}});
 valid.forEach(id=>{if(out.length<Math.min(11,valid.length)&&!seen.has(id)){seen.add(id);out.push(id)}});
 state.xi=out;
}
function initClub(){state.players=playersFor(state.club);normalizeXI();initSeason(false);save()}
function tabs(){let t=["Home","Squad & Tactics","League","Results","Cup","Jobs","Transfers"];document.getElementById("tabs").innerHTML=t.map(x=>`<button class="${state.tab===x?'on':''}" onclick="state.tab='${x}';save();render()">${x}</button>`).join("")}
function render(){tabs();({Home:home,"Squad & Tactics":squad,League:league,Results:resultsPage,Cup:cup,Jobs:jobs,Transfers:transfers}[state.tab])()}
function home(){
 const pos=standings().findIndex(x=>x.club===state.club)+1,total=leagueClubs().length*2-2;
 document.getElementById("app").innerHTML=`<div class="card"><div class="sub">${state.league} • Matchday ${state.matchday}/${total}</div><h2>${state.club}</h2><div class="grid"><div><div class="label">Manager rep</div><div class="stat">${state.rep}</div></div><div><div class="label">Balance</div><div class="stat">€${Math.round(state.balance).toLocaleString()}</div></div><div><div class="label">Record</div><div class="stat">${state.wins}-${state.draws}-${state.losses}</div></div><div><div class="label">League</div><div class="stat">#${pos||"-"} • ${state.points} pts</div></div></div></div>
 <div class="card"><h3>Next fixture</h3><p>${nextOpponent()}</p>${state.matchday<total?'<button class="primary" onclick="playMatch()">Play matchday</button>':'<div class="notice">League season complete.</div>'}</div>
 <div class="card"><h3>Latest matchday</h3>${latestRoundHTML()}</div>
 <div class="card"><h3>Real 2026/27 data</h3><p class="sub">Club/player names are sourced from current 2026/27 federation and squad listings. OVR is a game attribute, not an official player rating. Prva liga FBiH starting XIs are based on published 2026/27 match lineups.</p></div><div class="card"><h3>Season engine</h3><p class="sub">Every fixture on the matchday is simulated together. All clubs receive their points, goals and results, and the table is recalculated after every matchday.</p></div>`
}
function fixtureForRound(round){const n=leagueClubs().length;return state.fixtures.slice(round*n/2,(round+1)*n/2)}
function nextOpponent(){const total=leagueClubs().length*2-2;if(state.matchday>=total)return"Season complete";const f=fixtureForRound(state.matchday).find(x=>x.home===state.club||x.away===state.club);if(!f)return"Schedule pending";return`${f.home===state.club?"Home":"Away"} • ${f.home===state.club?f.away:f.home}`}
function poissonish(lambda){const r=Math.random();if(r<Math.exp(-lambda))return 0;if(r<.60)return 1;if(r<.86)return 2;if(r<.96)return 3;if(r<.99)return 4;return 5}
function simulateFixture(f){const diff=teamRating(f.home)+3.5-teamRating(f.away);return{home:f.home,away:f.away,hg:Math.min(poissonish(Math.max(.35,1.25+diff*.055)),6),ag:Math.min(poissonish(Math.max(.25,1.05-diff*.045)),6)}}
function applyResult(r){const h=state.table[r.home],a=state.table[r.away];h.p++;a.p++;h.gf+=r.hg;h.ga+=r.ag;a.gf+=r.ag;a.ga+=r.hg;if(r.hg>r.ag){h.w++;h.pts+=3;a.l++}else if(r.hg<r.ag){a.w++;a.pts+=3;h.l++}else{h.d++;a.d++;h.pts++;a.pts++}}
function standings(){return Object.values(state.table).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||b.w-a.w||a.club.localeCompare(b.club))}
function latestRoundHTML(){if(!state.results.length)return'<div class="sub">No matches played yet.</div>';return state.results[state.results.length-1].map(r=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>${r.home}</span><b>${r.hg}–${r.ag}</b><span>${r.away}</span></div>`).join("")}
function playMatch(){
 const total=leagueClubs().length*2-2;if(state.matchday>=total)return;
 normalizeXI();
 const round=fixtureForRound(state.matchday),my=round.find(x=>x.home===state.club||x.away===state.club);if(!my)return;
 let results=round.map(simulateFixture),idx=results.findIndex(r=>r.home===my.home&&r.away===my.away);
 const starters=state.xi.map(id=>state.players.find(p=>p.id===id)).filter(Boolean);
 const avg=starters.length?starters.reduce((a,p)=>a+p.ovr,0)/starters.length:teamRating(state.club);
 const mod=(avg-teamRating(state.club))*.025+(state.mentality==="Attacking"?.04:state.mentality==="Defensive"?-.02:0);
 const diff=(my.home===state.club?avg:teamRating(my.home))+3.5-(my.away===state.club?avg:teamRating(my.away));
 results[idx]={home:my.home,away:my.away,hg:Math.min(poissonish(Math.max(.35,1.25+diff*.055+mod)),6),ag:Math.min(poissonish(Math.max(.25,1.05-diff*.045-mod*.4)),6)};
 results.forEach(applyResult);state.results.push(results);state.matchday++;
 const r=results[idx], myGoals=r.home===state.club?r.hg:r.ag, oppGoals=r.home===state.club?r.ag:r.hg;
 state.played++;
 if(myGoals>oppGoals){state.wins++;state.rep+=2;state.balance+=15000}
 else if(myGoals<oppGoals){state.losses++;state.rep=Math.max(0,state.rep-1);state.balance-=5000}
 else{state.draws++;state.balance+=5000}
 const row=state.table[state.club];state.points=row?row.pts:state.points;state.wins=row?row.w:state.wins;state.draws=row?row.d:state.draws;state.losses=row?row.l:state.losses;
 save();render()
}
function squad(){
 if(!state.players.length)initClub(); normalizeXI();
 let formation=formations[state.formation],mapped=formation.map((slot,i)=>({slot,p:state.players.find(p=>p.id===state.xi[i])||null}));
 const bench=state.players.filter(p=>!state.xi.includes(p.id));
 document.getElementById("app").innerHTML=`<div class="card"><div class="row"><div><h2>Squad & Tactics</h2><div class="sub">${state.club}</div></div><select onchange="changeFormation(this.value)">${Object.keys(formations).map(f=>`<option ${f===state.formation?'selected':''}>${f}</option>`).join("")}</select></div></div><div class="pitch">${mapped.map(m=>`<div class="mark" style="left:${m.slot[1]}%;top:${m.slot[2]}%"><div class="shirt">${m.p?m.p.pos:"?"}</div><div class="small">${m.p?m.p.name:"Empty"}</div></div>`).join("")}</div><div class="card"><div class="row"><h3>Starting XI</h3><select onchange="state.mentality=this.value;save()"><option ${state.mentality==="Ultra Defensive"?"selected":""}>Ultra Defensive</option><option ${state.mentality==="Defensive"?"selected":""}>Defensive</option><option ${state.mentality==="Balanced"?"selected":""}>Balanced</option><option ${state.mentality==="Counter-Attack"?"selected":""}>Counter-Attack</option><option ${state.mentality==="Tiki-Taka"?"selected":""}>Tiki-Taka</option><option ${state.mentality==="Attacking"?"selected":""}>Attacking</option></select></div>${mapped.map((m,i)=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>${m.slot[0]}</span><select onchange="replaceXI(${i},this.value)">${state.players.map(p=>`<option value="${p.id}" ${m.p&&p.id===m.p.id?'selected':''}>${p.name} • ${p.ovr}</option>`).join("")}</select></div>`).join("")}</div><div class="card"><h3>Bench (${bench.length})</h3>${bench.length?`<div class="list">${bench.map(p=>`<div class="player"><span>${p.name}<br><span class="sub">${p.pos} • ${p.age} yrs</span></span><b>${p.ovr}</b><span class="sub">BENCH</span></div>`).join("")}</div>`:`<div class="notice">No additional verified squad players are loaded for this club yet.</div>`}</div><div class="card"><h3>Squad</h3><div class="list">${state.players.map(p=>`<div class="player"><span>${p.name}<br><span class="sub">${p.pos} • ${p.age} yrs</span></span><b>${p.ovr}</b><span class="sub">#${p.id+1}</span></div>`).join("")}</div></div>`}
function changeFormation(f){state.formation=f;normalizeXI();save();render()}
function replaceXI(i,id){
 normalizeXI(); id=+id;
 const current=state.xi[i], other=state.xi.indexOf(id);
 if(other>=0 && other!==i){state.xi[other]=current;state.xi[i]=id}
 else if(state.players.some(p=>p.id===id)){state.xi[i]=id}
 normalizeXI();save();render()
}
function resultsPage(){
 const rounds=state.results.slice().reverse();
 document.getElementById("app").innerHTML=`<div class="card"><h2>Matchday Results</h2><p class="sub">All completed league matchdays. Your club is highlighted.</p></div>${rounds.length?rounds.map((rs,ri)=>{const md=state.results.length-ri;return `<div class="card"><h3>Matchday ${md}</h3>${rs.map(r=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line);font-weight:${r.home===state.club||r.away===state.club?'800':'400'}"><span>${r.home}</span><b>${r.hg}–${r.ag}</b><span>${r.away}</span></div>`).join("")}</div>`}).join(""):`<div class="card"><div class="sub">No matchdays played yet.</div></div>`}`
}
function league(){const rows=standings();document.getElementById("app").innerHTML=`<div class="card"><h2>${state.league}</h2><div class="sub">After matchday ${state.matchday}. All fixtures are simulated simultaneously.</div></div><div class="card" style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th>#</th><th style="text-align:left">Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead><tbody>${rows.map((r,i)=>`<tr style="border-top:1px solid var(--line);${r.club===state.club?'font-weight:800':''}"><td style="padding:8px 4px">${i+1}</td><td style="padding:8px 4px;text-align:left">${r.club}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf-r.ga}</td><td>${r.pts}</td></tr>`).join("")}</tbody></table></div><div class="card"><h3>Recent results</h3>${latestRoundHTML()}</div>`}
function cup(){document.getElementById("app").innerHTML=`<div class="card"><h2>Kup BiH</h2><p>The national cup remains in the competition structure. Its draw/round engine will be connected after the league season engine is complete.</p><button onclick="alert('Cup draw module reserved for v0.3')">View draw</button></div>`}
function jobs(){let jobs=[["NK Čelik Zenica",58],["FK Radnik Bijeljina",55],["NK Bratstvo Gračanica",48],["FK Sarajevo",72],["FK Željezničar",71]];document.getElementById("app").innerHTML=`<div class="card"><h2>Jobs</h2><p class="sub">Your reputation: ${state.rep}. Higher reputation unlocks stronger clubs.</p>${jobs.map(j=>`<div class="club"><div style="flex:1"><b>${j[0]}</b><div class="sub">Required reputation: ${j[1]}</div></div><button ${state.rep<j[1]?'disabled':''} onclick="takeJob('${j[0]}')">Apply</button></div>`).join("")}</div>`}
function takeJob(c){state.club=c;state.league=Object.keys(leagues).find(l=>leagues[l].includes(c))||"Premijer Liga BiH";state.players=playersFor(c);state.xi=state.players.slice(0,11).map(p=>p.id);initSeason(true);state.tab="Home";save();render()}
function transfers(){document.getElementById("app").innerHTML=`<div class="card"><h2>Transfers</h2><p>Transfer market foundation is ready. v0.3 will add verified player pools, wages, fees, loans and club budgets.</p><div class="notice">The complete matchday engine is now active: every league fixture is simulated when you play.</div></div>`}
function resetGame(){if(confirm("Reset local career?")){localStorage.removeItem("bhfm");location.reload()}}
initClub();render();
</script>
</body></html>
